[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mapspatial-evalkit"
version = "0.1.0"
description = "MapSpatial-EvalKit: multimodal reasoning & evaluation for outdoor map spatial understanding"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "requests>=2.28",
    "tqdm>=4.65",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
api = ["openai>=1.0"]
video = ["decord>=0.6", "opencv-python>=4.8"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
mapspatial = "mapspatial.cli:main"

[tool.setuptools.packages.find]
include = ["mapspatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
