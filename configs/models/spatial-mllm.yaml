# Spatial-MLLM via spatial_mllm backend (VGGT spatial encoding)
name: Spatial-MLLM
backend: spatial_mllm
model_path: ${CKPT_DIR}/Spatial-MLLM-v1.1-Instruct-820K

load:
  dtype: bfloat16

generate:
  temperature: 0.0
  max_new_tokens: 2048

backend_args:
  model_type: spatial-mllm

strategies: [direct]
