# SenseNova-U1-8B-MoT multimodal model config for MapSpatial-EvalKit
name: SenseNova-U1-8B-MoT
backend: veomni_u1
model_path: ${CKPT_DIR}/SenseNova-U1-8B-MoT

load:
  dtype: bfloat16
  device: cuda

generate:
  temperature: 0.0
  max_new_tokens: 512

backend_args:
  cfg_scale: 4.0
  img_cfg_scale: 1.0
  num_steps: 30
  image_size: [256, 256]
  # forced_interleave: inject <img> after N reasoning tokens (think_mode on)
  # — U1 does not emit <img> under VQA-style prompts (0% native draw rate)
  force_image_at: 256

# native_interleave intentionally NOT registered: U1 does not emit '<img>'
# under VQA-style prompts (0% draw rate measured); forced_interleave is the
# supported interleave path for this checkpoint.
strategies: [direct, external_draw, forced_interleave]
