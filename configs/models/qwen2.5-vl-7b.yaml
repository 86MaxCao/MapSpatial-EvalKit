# Qwen2.5-VL-7B-Instruct via vLLM
name: Qwen2.5-VL-7B-Instruct
backend: vllm
model_path: ${CKPT_DIR}/Qwen2.5-VL-7B-Instruct

load:
  max_model_len: 32768
  gpu_memory_utilization: 0.7
  limit_mm_per_prompt:
    image: 24
    video: 1
  dtype: bfloat16
  trust_remote_code: true

generate:
  temperature: 0.0
  max_new_tokens: 2048

batch_size: 32

backend_args:
  prompt_style: qwen

strategies: [direct]
