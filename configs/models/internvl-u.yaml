# InternVL-U unified multimodal model config for MapSpatial-EvalKit
name: InternVL-U
backend: veomni_internvlu
model_path: ${CKPT_DIR}/InternVL-U

load:
  dtype: bfloat16
  device: cuda

generate:
  temperature: 0.0
  max_new_tokens: 512

backend_args:
  all_cfg_scale: 4.5
  part_cfg_scale: 2.0
  num_inference_steps: 20

strategies: [direct, native_interleave, external_draw]
