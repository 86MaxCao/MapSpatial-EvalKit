# Step3-VL-10B via vLLM (url-style content)
name: Step3-VL-10B
backend: vllm
model_path: ${CKPT_DIR}/Step3-VL-10B

load:
  dtype: bfloat16
  trust_remote_code: true
  max_model_len: 32768
  gpu_memory_utilization: 0.7

generate:
  temperature: 0.0
  max_new_tokens: 4096

backend_args:
  prompt_style: glm

strategies: [direct]
