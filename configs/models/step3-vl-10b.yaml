# Step3-VL-10B via transformers (GLM family, url-style content)
name: Step3-VL-10B
backend: transformers
model_path: ${CKPT_DIR}/Step3-VL-10B

load:
  model_family: glm
  model_class: AutoModelForCausalLM
  attn_implementation: sdpa
  dtype: bfloat16
  trust_remote_code: true

generate:
  temperature: 0.0
  max_new_tokens: 4096

backend_args:
  prompt_style: glm

strategies: [direct]
