# LatentUM-Base unified multimodal model config for MapSpatial-EvalKit
name: LatentUM-Base
backend: veomni_latentum
model_path: ${CKPT_DIR}/LatentUM-Base

load:
  dtype: bfloat16
  device: cuda
  # Force SDPA: in transformers 5.x the default flash_attention_2 path is broken
  # (create_causal_mask=None + causal=False during decode) → output degenerates
  # to repeated token-0 ("A!!!..."). SDPA uses explicit 4D causal mask. See
  # docs/latentum-transformers5-flash-attn-bug.md.
  attn_implementation: sdpa

generate:
  temperature: 0.0
  max_new_tokens: 128

backend_args:
  cfg_scale: 3.0
  temperature: 0.9
  top_k: 50
  top_p: 0.95
  decoder_path: ${CKPT_DIR}/LatentUM-Decoder

strategies: [direct, external_draw]
