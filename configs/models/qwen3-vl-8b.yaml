# Qwen3-VL-8B-Instruct via vLLM (true batch)
name: Qwen3-VL-8B-Instruct
backend: vllm
model_path: ${CKPT_DIR}/Qwen3-VL-8B-Instruct

load:
  max_model_len: 32768
  gpu_memory_utilization: 0.7
  limit_mm_per_prompt:
    image: 24
    video: 1
  dtype: bfloat16
  trust_remote_code: true
  enforce_eager: true

generate:
  temperature: 0.0
  max_new_tokens: 4096

batch_size: 32

backend_args:
  prompt_style: qwen

strategies: [direct]
