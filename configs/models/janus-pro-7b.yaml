# Janus-Pro-7B unified multimodal model config for MapSpatial-EvalKit
name: Janus-Pro-7B
backend: veomni_janus
model_path: ${CKPT_DIR}/Janus-Pro-7B

load:
  dtype: bfloat16
  device: cuda

generate:
  temperature: 0.0
  max_new_tokens: 512

backend_args:
  cfg_weight: 5.0
  temperature: 1.0
  image_token_num: 576
  parallel_size: 1

strategies: [direct, external_draw]
