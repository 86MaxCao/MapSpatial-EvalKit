# gemini-3-flash-preview via API (Google AI Studio, 512px image sizing)
name: gemini-3-flash
backend: api

generate:
  temperature: 0.0
  max_new_tokens: 2048

backend_args:
  api_url: ${GOOGLE_API_URL}
  api_model: gemini-3-flash-preview
  image_max_side: 512
  image_quality: 75

strategies: [direct]
