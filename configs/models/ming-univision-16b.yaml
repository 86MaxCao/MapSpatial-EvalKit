# Ming-UniVision-16B-A3B unified multimodal model config for MapSpatial-EvalKit
name: Ming-UniVision-16B-A3B
backend: veomni_mingunivision
model_path: ${CKPT_DIR}/Ming-UniVision-16B-A3B

load:
  dtype: bfloat16
  device: cuda

generate:
  temperature: 0.0
  max_new_tokens: 512

backend_args:
  image_gen_text_cfg: 3.0
  image_gen_image_cfg: 1.1
  num_inference_steps: 16

strategies: [direct, native_interleave, external_draw]
