# GLM-4.6V via vLLM (url-style content)
name: GLM-4.6V-Flash
backend: vllm
model_path: ${CKPT_DIR}/GLM-4.6V-Flash

load:
  dtype: bfloat16
  trust_remote_code: true
  max_model_len: 32768
  gpu_memory_utilization: 0.7

generate:
  temperature: 0.0
  max_new_tokens: 4096

backend_args:
  prompt_style: glm

strategies: [direct]
